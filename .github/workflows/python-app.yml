# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: check for python
      id: check-python
      shell: pwsh
      run: |
        $python = Get-Command python -ErrorAction SilentlyContinue
        if ($python) {
          $version = python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
          if ($version -eq "3.10") {
            "installed=true" >> $env:GITHUB_OUTPUT
            Write-Host "Python 3.10 is already available; skipping setup."
            exit 0
          }
        }

        "installed=false" >> $env:GITHUB_OUTPUT
        Write-Host "Python 3.10 was not found; setup will run."
      
    - uses: actions/checkout@v4
    - name: set up python
      if: steps.check-python.outputs.installed != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: modules
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pyinstaller
        python -m pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Pyinstaller compilation
      run: |
        pyinstaller main.py --onefile --icon="icon.ico"
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/main.exe


  release:
      needs: build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: windows-latest
      permissions:
        contents: write
  
      steps:
        - name: Download executable
          uses: actions/download-artifact@v4
          with:
            name: windows-executable
            path: dist
  
        - name: Create pre-release build
          uses: softprops/action-gh-release@v3
          with:
            name: "Lynx Nightly"
            body: |
              nightly build. likely unstable.
              please do not install this build for personal use
            tag_name: nightly-${{ github.run_id }}
            generate_release_notes: true
            files: dist/main.exe
            prerelease: true
        - name: Delete builds
          shell: cmd
          run: ./deletebuilds.bat

